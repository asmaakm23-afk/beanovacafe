<title>Beanova</title>

<title>Beanova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Pacifico&family=Montserrat:wght@500;600&display=swap">
<style>
:root{
  --ink:#24403A; --ink2:#566A64; --paper:#FFFBF8; --paper2:#FBF1EE; --line:rgba(36,64,58,.13);
  --pink:#F4CBD3; --peach:#F7CD9A; --sky:#B8D3EE; --coral:#EA9D9B; --grey:#808285; --teal:#5F8B90; --olive:#8C9A4C; --tile:#2E6A4E;
  --shadow:0 10px 30px rgba(36,64,58,.14), 0 2px 6px rgba(36,64,58,.08);
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:#DCE9F3;color:var(--ink);font-family:"DM Sans",system-ui,"Segoe UI",sans-serif;font-size:14px;direction:ltr}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pin{position:absolute;top:0;left:0;pointer-events:auto;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border:0;border-radius:999px;background:rgba(255,251,248,.94);box-shadow:0 3px 10px rgba(36,64,58,.18);white-space:nowrap;font-size:12.5px;font-weight:600;transition:background .15s, transform .08s;will-change:transform}
.pin .n{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;font-variant-numeric:tabular-nums}
.pin .d{display:none;font-weight:500;color:var(--ink2);font-size:11.5px}
.pin:hover,.pin.on{background:var(--pink)}
.pin.on .n{background:var(--ink)}
.plan .pin .d{display:inline}
.pin.dim{background:var(--ink);color:#fff;padding:3px 9px;font-weight:700;pointer-events:none;font-variant-numeric:tabular-nums}
.pin.dim .n{display:none}
.hidden-pin{display:none!important}

.topbar{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;left:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;background:var(--paper);padding:8px 14px 8px 10px;border-radius:16px;box-shadow:var(--shadow)}
.brand svg{flex:none}
.brand h1{margin:0;font-family:"Fraunces",Georgia,serif;font-size:21px;font-weight:700;line-height:1.1;letter-spacing:0}
.brand h1.latin{font-family:"Montserrat",sans-serif;font-weight:500;font-size:20px;letter-spacing:.2em;color:#545A2B}
.brand p{margin:2px 0 0;font-size:12px;color:var(--ink2)}
.modes{display:flex;background:var(--paper);border-radius:14px;padding:4px;box-shadow:var(--shadow);gap:2px}
.modes button{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:600;display:flex;align-items:center;gap:6px}
.modes button[aria-pressed="true"]{background:var(--ink);color:#fff}
.menu-btn{display:none;border:0;background:var(--paper);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow);font-weight:600}

.panel{position:absolute;top:calc(84px + env(safe-area-inset-top,0px));right:12px;width:290px;max-height:calc(100% - 110px);overflow:auto;background:rgba(255,251,248,.96);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0 0 8px;font-size:11.5px;font-weight:700;color:var(--ink2);letter-spacing:.02em}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;background:var(--paper2);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;padding:7px 4px;border-radius:9px;font-weight:600;font-size:12.5px}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 4px rgba(36,64,58,.15);color:var(--ink)}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tg{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px;font-size:12.5px;font-weight:500;text-align:left}
.tg i{width:26px;height:15px;border-radius:9px;background:#D7DDDB;position:relative;flex:none;transition:background .15s}
.tg i::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:right .15s}
.tg[aria-pressed="true"] i{background:var(--teal)}
.tg[aria-pressed="true"] i::after{left:13px}
.zones{display:flex;flex-direction:column;gap:2px}
.zones .fl{font-size:11.5px;font-weight:700;color:var(--ink2);margin:8px 0 3px;display:flex;justify-content:space-between}
.zones .fl:first-child{margin-top:0}
.zones .fl span{font-weight:500;font-variant-numeric:tabular-nums}
.zbtn{display:flex;align-items:center;gap:9px;border:0;background:transparent;border-radius:9px;padding:6px 6px;text-align:left;width:100%}
.zbtn:hover{background:var(--paper2)}
.zbtn.on{background:var(--pink)}
.zbtn .n{display:grid;place-items:center;width:21px;height:21px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;flex:none;font-variant-numeric:tabular-nums}
.zbtn .t{flex:1;font-weight:600;font-size:13px}
.zbtn .d{color:var(--ink2);font-size:11px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--paper2);border-radius:12px;padding:9px 10px}
.stat b{display:block;font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:11.5px;color:var(--ink2)}
.swatches{display:flex;gap:5px}
.swatches span{flex:1;height:18px;border-radius:5px}

.card{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:340px;max-width:calc(100% - 32px);background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px}
.card .row{display:flex;align-items:center;gap:10px}
.card .n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;flex:none}
.card h3{margin:0;font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:700;flex:1;text-wrap:balance}
.card .meta{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--paper2);font-variant-numeric:tabular-nums}
.chip.f{background:var(--sky)}
.card img{width:100%;max-height:190px;object-fit:cover;border-radius:12px;display:block}
.card p{margin:0;line-height:1.7;color:var(--ink2);font-size:13.5px}
.card .acts{display:flex;gap:6px;margin-top:2px}
.btn{border:0;border-radius:10px;padding:8px 12px;font-weight:600;background:var(--ink);color:#fff}
.btn.ghost{background:var(--paper2);color:var(--ink)}
.x{border:0;background:transparent;font-size:20px;line-height:1;padding:2px 6px;color:var(--ink2)}

.hint{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:rgba(36,64,58,.86);color:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;white-space:nowrap;pointer-events:none}
.pad{position:absolute;bottom:calc(60px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:6px;direction:ltr}
.pad button{border:0;border-radius:14px;background:rgba(255,251,248,.92);box-shadow:var(--shadow);font-size:18px;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none}
.pad button:active{background:var(--pink)}
.pad .up{grid-column:2;grid-row:1}.pad .lf{grid-column:1;grid-row:2}.pad .dn{grid-column:2;grid-row:2}.pad .rt{grid-column:3;grid-row:2}
.pad .fl{grid-column:1 / span 1;grid-row:1;font-size:11px;line-height:1.2;background:var(--sky)}
.pad .ex{grid-column:3;grid-row:1;font-size:11px;background:var(--pink)}
#loader{position:absolute;inset:0;display:grid;place-items:center;background:#DCE9F3;z-index:5;font-family:"Fraunces",Georgia,serif;font-size:20px}
#loader small{display:block;font-family:"DM Sans",sans-serif;font-size:13px;color:var(--ink2);margin-top:6px;text-align:center}

@media (max-width:760px){
  .brand p{display:none}
  .brand h1{font-size:18px}
  .modes button{padding:7px 9px;font-size:12.5px}
  .modes button svg{display:none}
  .menu-btn{display:block}
  .topbar{flex-wrap:wrap}
  .panel{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));right:12px;left:12px;width:auto;max-height:55%}
  .panel.closed{display:none}
  .card{left:12px;right:12px;width:auto;max-width:none;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .hint{display:none}
  .pad{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:761px){ .panel.closed{display:flex} }
</style>

function C(p,rt,rb,h,x,y,z,m,seg){ const o=new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg||20),m); o.position.set(x,y+h/2,z); o.castShadow=true; o.receiveShadow=true; p.add(o); return o; }
function S(p,r,x,y,z,m,sx,sy,sz){ const o=new T.Mesh(new T.SphereGeometry(r,16,12),m); o.position.set(x,y,z); o.scale.set(sx||1,sy||1,sz||1); o.castShadow=true; p.add(o); return o; }
function grp(p,x,y,z,ry){ const g=new T.Group(); g.position.set(x,y,z); g.rotation.y=ry||0; p.add(g); return g; }

/* instanced small parts: leaves & boxes */
const instStore = new Map();
function inst(parent,kind,x,y,z,sx,sy,sz,col,ry){ if(!instStore.has(parent)) instStore.set(parent,{leaf:[],box:[]}); instStore.get(parent)[kind].push([x,y,z,sx,sy,sz,col,ry||0]); }
const LEAVES=['#4F8A4B','#5E9C57','#3F7640','#6FAE62','#86B86F','#4C7F45'];
function leaf(p,x,y,z,s,col){ inst(p,'leaf',x,y,z,s,s*.8,s,col||LEAVES[(Math.random()*LEAVES.length)|0],Math.random()*6); }
function flushInst(){
  const lg=new T.IcosahedronGeometry(1,0), bg=new T.BoxGeometry(1,1,1);
  const lm=new T.MeshStandardMaterial({roughness:.75,flatShading:true}), bm=new T.MeshStandardMaterial({roughness:.8});
  const d=new T.Object3D(), c=new T.Color();
  instStore.forEach((st,parent)=>{
    [['leaf',lg,lm],['box',bg,bm]].forEach(([k,g,m])=>{
      const arr=st[k]; if(!arr.length) return;
      const im=new T.InstancedMesh(g,m,arr.length);
      arr.forEach((a,i)=>{ d.position.set(a[0],a[1],a[2]); d.scale.set(a[3],a[4],a[5]); d.rotation.set(k==='leaf'?a[7]*.7:0,a[7],0); d.updateMatrix(); im.setMatrixAt(i,d.matrix); c.set(a[6]); im.setColorAt(i,c); });
      im.castShadow=true; im.receiveShadow=true; parent.add(im);
    });
  });
}

function ctex(w,h,draw,rx,ry){ const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const g=cv.getContext('2d'); draw(g,w,h); const t=new T.CanvasTexture(cv); t.encoding=T.sRGBEncoding; t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(rx||1,ry||1); t.anisotropy=8; return t; }
function rep(t,rx,ry){ const n=t.clone(); n.needsUpdate=true; n.repeat.set(rx,ry); return n; }

function drawSprig(g,x,y,s,col){
  g.strokeStyle=col; g.lineWidth=2.2*s; g.lineCap='round';
  g.beginPath(); g.moveTo(x,y); g.bezierCurveTo(x+6*s,y-60*s,x-8*s,y-120*s,x+2*s,y-170*s); g.stroke();
  for(let i=0;i<7;i++){ const t=i/7, yy=y-20*s-t*140*s, dir=i%2?1:-1, lx=x+dir*(22-t*10)*s;
    g.beginPath(); g.ellipse((x+lx)/2,yy-6*s,11*s*(1-t*.4),4.5*s,dir*-.6,0,7); g.stroke(); }
}
function makeTextures(){

  TX.floor = ctex(512,512,(g,w)=>{

      const x=i*step+(j%2?step/2:0), y=j*step+step/2; const k=Math.random();
      g.fillStyle=k<.05?'#7F8684':(k<.2?'#B6BAB6':'#F2F0EB'); g.beginPath(); g.arc(x%w,y,r,0,7); g.fill(); if(x>w-r) { g.beginPath(); g.arc(x-w,y,r,0,7); g.fill(); }

    g.fillStyle='#6E7573'; g.fillRect(0,4,w,4); g.fillRect(0,h-8,w,4);

      g.beginPath(); g.moveTo(x+6,h-18); g.lineTo(x+70,h-18); g.stroke(); }
  });

  TX.subway = ctex(256,256,(g,w)=>{

    for(let i=0;i<6;i++)for(let j=0;j<6;j++){ const l=84+Math.random()*4; g.fillStyle=`hsl(90,6%,${l}%)`; g.fillRect(i*s+1.5,j*s+1.5,s-3,s-3); g.fillStyle='rgba(255,255,255,.35)'; g.fillRect(i*s+3,j*s+3,s-6,4); }
  });

  // fluted oak panel (0.6 m)

function buildWall(parent,c){

    const vs=o.grid?.55:1.1, nm=Math.max(0,Math.round(w/vs)-1); for(let k=1;k<=nm;k++) B(g,o.grid?.03:.05,h,fd*.6,o.a+w*k/(nm+1),o.bot,0,fm);

}

/* ---------- walk mode ---------- */
const player={x:3.1,z:2.9,level:0,onStairs:false,yaw:0,pitch:-.05,y:1.6};
const OBS={0:[[-5.6,.4,-.6,0],[-.2,.4,-2.2,-.6],[-6,-3.9,-1.56,-1.44],[-3.1,-2.94,-1.56,-1.44],[-3.06,-2.94,-3.5,-1.44],[-3,.8,-3.5,-2.9],[5.45,6,-1.6,2.4],[-5.95,-3.1,-3.5,-2.9],[-5.95,-5.25,-2.8,-2.1],[-4.85,-3.55,-2.12,-1.57],
  [-5.25,-4.55,1.75,2.45],[-3.35,-2.65,1.75,2.45],[-1.45,-.75,1.75,2.45],[.45,1.15,1.75,2.45],[4.7,5.3,-1.2,-.6],[4.7,5.3,.1,.7],[4.7,5.3,1.4,2.0],[1.2,3.0,-3.45,-2.95],[4.05,4.45,2.95,3.35]],
  1:[[-6,-5.0,-1.36,-1.24],[-4.2,-3.94,-1.36,-1.24],[-4.06,-3.94,-3.5,-1.24],[-3.8,-1.4,-3.5,-2.92],[-4.3,.9,1.1,2.1],[2.9,3.9,-1.4,2.4],[-6,-5.6,-1.0,2.6],[5.6,6,.4,3.3],[.9,4.1,3.05,3.5],[-3.7,-1.9,-.75,.05]]};
function blocked(x,z,lvl){ const r=.22; return OBS[lvl].some(o=>x>o[0]-r&&x<o[1]+r&&z>o[2]-r&&z<o[3]+r); }
function inStair(x,z){ return x>HOLE[0]&&x<HOLE[1]&&z>-3.45&&z<-2.35; }
function tryMove(nx,nz){
  nx=Math.max(-5.75,Math.min(5.75,nx)); nz=Math.max(-3.25,Math.min(3.25,nz));
  if(player.onStairs){ nz=Math.max(-3.28,Math.min(-2.52,nz)); if(nx>=5.4){player.onStairs=false;player.level=0;} else if(nx<=1.1){player.onStairs=false;player.level=1;} player.x=nx; player.z=nz; return; }
  if(inStair(nx,nz)){
    if(player.level===0 && nx>4.9 && nz<-2.5){ player.onStairs=true; player.x=nx; player.z=nz; return; }
    if(player.level===1 && nx<1.7 && nz<-2.5){ player.onStairs=true; player.x=nx; player.z=nz; return; }
    return;
  }
  if(blocked(nx,nz,player.level) && !blocked(player.x,player.z,player.level)) return;
  player.x=nx; player.z=nz;
}
function enterWalk(w,lvl){
  player.x=w[0]; player.z=w[1]; player.level=lvl; player.onStairs=false; player.yaw=Math.atan2(-(w[2]-w[0]),-(w[3]-w[1])); player.pitch=-.08; player.y=lvl*FH+1.6;
  if(mode!=='walk'){ setMode('walk'); }
  camera.fov=68; camera.updateProjectionMatrix(); fly=null;
  floorMode=lvl?'upper':'ground'; setPressed('#floors button',floorMode);
  if(!card.hidden && selected) showCard(selected);
}
const keys={};
const KM={KeyW:'f',ArrowUp:'f',KeyS:'b',ArrowDown:'b',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r'};
addEventListener('keydown',e=>{ if(KM[e.code]&&mode==='walk'){ keys[KM[e.code]]=true; e.preventDefault(); } if(e.key==='Shift') keys.run=true; if(e.code==='Escape'&&mode==='walk') setMode('orbit'); });
addEventListener('keyup',e=>{ if(KM[e.code]) keys[KM[e.code]]=false; if(e.key==='Shift') keys.run=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
pad.querySelectorAll('[data-k]').forEach(b=>{ const k=b.dataset.k; const on=e=>{e.preventDefault(); keys[k]=true;}; const off=()=>{keys[k]=false;}; b.addEventListener('pointerdown',on); ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,off)); });
document.getElementById('padFloor').onclick=()=>{ if(player.level===0) enterWalk([.4,-2.9,-3,-1],1); else enterWalk([5.7,-1.9,3,1],0); };
document.getElementById('padExit').onclick=()=>setMode('orbit');
let drag=null;
let clickStart=null; const ray=new T.Raycaster(), ndc=new T.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{ clickStart={x:e.clientX,y:e.clientY}; },true);
renderer.domElement.addEventListener('pointerup',e=>{ if(mode!=='orbit'||!clickStart) return; if(Math.hypot(e.clientX-clickStart.x,e.clientY-clickStart.y)>5) return;
  const r=renderer.domElement.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc,camera);
  for(const c of carGroups){ if(ray.intersectObject(c.g,true).length){ const z=ZONES.find(q=>q.n===c.n); if(z) focusZone(z); break; } } });
renderer.domElement.addEventListener('pointerdown',e=>{ if(mode!=='walk') return; drag={x:e.clientX,y:e.clientY,id:e.pointerId}; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove',e=>{ if(!drag||mode!=='walk') return; const k=e.pointerType==='touch'?.006:.0045; player.yaw+=(e.clientX-drag.x)*k; player.pitch=Math.max(-1.2,Math.min(1.1,player.pitch+(e.clientY-drag.y)*k)); drag.x=e.clientX; drag.y=e.clientY; });
['pointerup','pointercancel'].forEach(ev=>renderer.domElement.addEventListener(ev,()=>{ drag=null; }));

/* ---------- loop ---------- */
const clock=new T.Clock(), tmp=new T.Vector3();
function resize(){ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); if(mode==='plan') fitOrtho(); }
addEventListener('resize',resize);
function updateWalls(){ if(mode!=='orbit'||floorMode==='whole'||!autoWalls) return; const c=camera.position;
  SIDES.front.forEach(g=>g.visible=c.z<3.75); SIDES.back.forEach(g=>g.visible=c.z>-3.75); SIDES.left.forEach(g=>g.visible=c.x>-6.25); SIDES.right.forEach(g=>g.visible=c.x<6.25); }
function updateLabels(cam){
  const w=stage.clientWidth,h=stage.clientHeight;
  ZONES.forEach(z=>{ let vis=showLabels;
    if(mode==='orbit') vis = vis && (floorMode==='whole'?false: floorMode==='ground'? z.f===0 : z.f===1);
    else if(mode==='plan') vis = vis && z.f===(floorMode==='upper'?1:0);
    else { const lvl=player.onStairs?-1:player.level; const dx=z.v.x-player.x, dz=z.v.z-player.z; vis = vis && z.f===lvl && Math.hypot(dx,dz)<7.5; }
    if(vis){ tmp.copy(z.v); if(mode==='plan') tmp.y=(z.f?FH:0)+1; tmp.project(cam); if(tmp.z>1||tmp.z<-1) vis=false; }
    if(!vis){ z.el.classList.add('hidden-pin'); return; }
    z.el.classList.remove('hidden-pin'); z.el.style.transform=`translate3d(${((tmp.x*.5+.5)*w).toFixed(1)}px,${((-tmp.y*.5+.5)*h).toFixed(1)}px,0) translate(-50%,-50%)`;
  });
  DIMLABELS.forEach(d=>{ if(mode!=='plan'){ d.el.classList.add('hidden-pin'); return; } tmp.copy(d.v).project(cam); d.el.classList.remove('hidden-pin'); d.el.style.transform=`translate3d(${((tmp.x*.5+.5)*w).toFixed(1)}px,${((-tmp.y*.5+.5)*h).toFixed(1)}px,0) translate(-50%,-50%)`; });
}
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,clock.getDelta()), now=performance.now();
  if(fly){ const k=Math.min(1,(now-fly.t0)/fly.dur), e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2; camera.position.lerpVectors(fly.p0,fly.p1,e); orbit.target.lerpVectors(fly.q0,fly.q1,e); if(k>=1) fly=null; }
  let cam=camera;
  if(mode==='walk'){
    const f=(keys.f?1:0)-(keys.b?1:0), s=(keys.r?1:0)-(keys.l?1:0);
    if(f||s){ const sp=(keys.run?3.6:1.9)*dt, sy=Math.sin(player.yaw), cy=Math.cos(player.yaw); const dx=(-sy*f+cy*s)*sp, dz=(-cy*f-sy*s)*sp; tryMove(player.x+dx,player.z); tryMove(player.x,player.z+dz); }
    const base=player.onStairs?Math.max(0,Math.min(FH,(5.4-player.x)/4.32*FH)):player.level*FH;
    player.y+=(base+1.6-player.y)*Math.min(1,dt*10);
    camera.position.set(player.x,player.y,player.z); camera.rotation.order='YXZ'; camera.rotation.set(player.pitch,player.yaw,0);
  } else if(mode==='plan'){ cam=ortho; orbit2.update(); }
  else { orbit.update(); }
  updateWalls();
  renderer.render(scene,cam);
  updateLabels(cam);
}

/* ---------- boot ---------- */
const fontsReady = (document.fonts && document.fonts.load) ? Promise.all([document.fonts.load('600 40px "Fraunces"'),document.fonts.load('600 80px "Montserrat"'),document.fonts.load('96px "Pacifico"'),document.fonts.load('500 30px "DM Sans"'),document.fonts.load('600 30px "DM Sans"')]) : Promise.resolve();
Promise.all([Promise.race([fontsReady,new Promise(r=>setTimeout(r,2500))]).catch(()=>{}),new Promise(r=>{ const im=new Image(); im.onload=()=>{LOGO_IMG=im; r();}; im.onerror=()=>r(); im.src=LOGO_SRC; })]).catch(()=>{}).then(()=>{
  build(); applyLight(); setMode('orbit'); resize();
  if(innerWidth>760) setPanel(true);
  document.getElementById('loader').hidden=true;
  frame();
});
})();
</script>
